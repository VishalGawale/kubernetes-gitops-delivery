global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: ai-platform
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - ai-platform-metrics.dev.svc.cluster.local
          - ai-platform-metrics.prod.svc.cluster.local
        type: A
        port: 8000
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        regex: ai-platform-metrics\.([a-z]+)\.svc\.cluster\.local
        target_label: environment
