global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: ai-platform
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-platform.dev.svc.cluster.local:8000"]
        labels:
          environment: dev
      - targets: ["ai-platform.prod.svc.cluster.local:8000"]
        labels:
          environment: prod