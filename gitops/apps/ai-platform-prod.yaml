apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-platform-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VishalGawale/kubernetes-gitops-delivery.git
    targetRevision: main
    path: gitops/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
