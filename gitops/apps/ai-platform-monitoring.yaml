apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-platform-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VishalGawale/kubernetes-gitops-delivery.git
    targetRevision: main
    path: gitops/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true